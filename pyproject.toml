[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "besfundlens"
version = "0.2.0"
description = "Bilingual analytics and allocation-classification engine for Turkish pension funds"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "İlyas Hakyemez"}]
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "holidays>=0.50",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The web interface. The library itself does not need Streamlit, so installing
# besfundlens as a dependency does not drag it in; requirements.txt has it
# because that is the file Streamlit Cloud reads.
app = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["besfundlens*"]
