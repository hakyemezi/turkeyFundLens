# Rebuilds the static site from TEFAS every working evening and publishes it to
# GitHub Pages. TEFAS publishes the day's prices in the evening, so the run is
# set after that; GitHub may start scheduled runs some minutes late.
name: Site

on:
  schedule:
    - cron: "30 19 * * 1-5"   # 22:30 in Istanbul, Monday to Friday
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Held to the major version the build was tested with locally
      - run: pip install -e ".[site]" "pandas<3"
      - run: python site/build.py --out _site
        env:
          PYTHONUNBUFFERED: "1"   # fetch progress in the log as it happens
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bing, Yandex and the other IndexNow engines are told what changed. Google
  # reads the sitemap through Search Console instead.
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python site/indexnow.py
